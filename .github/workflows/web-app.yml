name: web-app
# The web copy of OpenVitals: the APK of each commit, photographed screen by screen on an
# emulator with demo data and published as a PWA. Every push to main republishes it, so the
# web copy is always that commit's app. Pushes to main_claude build it as an artifact only.
on:
  push:
    branches: [main, main_claude]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the app and the demo seeder
        run: scripts/ci-android-gradle.sh :app:assembleCi :app:assembleCiAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Photograph every screen of the real app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/web-capture.sh web-app/out
      - name: Build the PWA
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/web_build.py web-app/out web-app/dist "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-app
          path: |
            web-app/out/graph.json
            web-app/out/*.txt
            web-app/dist/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web-app/dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: capture
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
