name: OpenVitals Web
on:
  push:
    branches: [main, main_claude]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript
        working-directory: web
        run: |
          node --check app.js
          node --check model.js
          node --check views.js
          node --check state.js
          node --check metrics.js
      - name: Build PWA and sync Android widget metadata
        working-directory: web
        run: npm run build
      - name: Verify periods, backups and offline PWA shell
        working-directory: web
        run: npm test
