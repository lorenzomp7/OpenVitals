name: verify
on:
  pull_request:
  push:
    branches: [main, claude_chatgpt_rebuilt]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  docs-links:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/sync-wiki.py --repo "$GITHUB_REPOSITORY" --check
  app-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APKs and run unit tests and preflight once
        run: scripts/ci-android-gradle.sh -Popenvitals.testForks=4 :app:assembleCi :app:assembleCiAndroidTest verifyCiUnitTest verifyCiPreflight
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: ci-apks
          path: app/build/outputs/apk/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            domain/build/reports/tests/
  emulator:
    needs: app-test
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: ci-apks
          path: app/build/outputs/apk/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/personal-ui-verification.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvitals-verified-apk-and-screenshots
          path: |
            app/build/outputs/apk/ci/*.apk
            dashboard-emulator-evidence/
          if-no-files-found: error
  lint:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: gradle/actions/setup-gradle@v5
      - run: scripts/ci-android-gradle.sh verifyCiLint
