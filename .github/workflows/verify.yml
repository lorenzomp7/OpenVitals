# The gate. A pull request and a push to main run it; the release workflow
# (release.yml) looks its result up instead of running it again.
#
# Two jobs. app-test on every pull request and push; lint on pushes to main
# only (lint alone is half of the gate's task time, and a finding is rarely
# what a review turns on; main catches it before a nightly ships).
# Locally the whole gate is one invocation, verifyCi.
#
# Every workflow pins ubuntu-26.04, the image ubuntu-latest moves to between
# 2026-10-19 and 2026-11-19, so no job changes image halfway through that move.
# Its default Java is 25; scripts/ci-gradle.sh takes the image's JDK 17.
# setup-gradle stays on v5: v6 moves its caching into a proprietary component
# under Gradle's terms of use.
name: verify

on:
  pull_request:
  push:
    branches: [main, main_claude]

permissions:
  contents: read

# New pull-request and personal-branch pushes supersede their older verification runs.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main_claude' }}

defaults:
  run:
    shell: bash

jobs:
  # Lint runs on a push to main only; everything else runs on every event.
  context:
    runs-on: ubuntu-26.04
    outputs:
      run_lint: ${{ steps.plan.outputs.run_lint }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run_lint=false
          if [ "$EVENT" = "push" ]; then run_lint=true; fi
          echo "run_lint=$run_lint" >> "$GITHUB_OUTPUT"
          echo "plan: lint=$run_lint"

  # The wiki is built from the Markdown (wiki.yml); a relative link to a file
  # that does not exist would be a 404 there, so it fails here.
  docs-links:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/sync-wiki.py --repo "$GITHUB_REPOSITORY" --check

  # The stock runner ships JDK 17 and the Android SDK; scripts/ci-android-setup.sh
  # installs the platform and build-tools when the image lacks them. Each job
  # gives setup-gradle a Gradle user home of its own: the action leaves caching
  # off when the runner already has one with caches in it. A step, since a
  # job-level env cannot read the runner context.

  # verifyCiUnitTest (:domain:testCiUnitTest, :app:testCiUnitTest)
  # and verifyCiPreflight (verifyTranslations, :app:checkCiDuplicateClasses,
  # :app:compileCiAndroidTestKotlin). No lint here, so every core gets a test
  # fork (app/build.gradle.kts reads openvitals.testForks).
  app-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          # The OpenLink library is a submodule the app builds from.
          submodules: true
      - run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
      - run: scripts/ci-android-gradle.sh -Popenvitals.testForks=4 verifyCiUnitTest verifyCiPreflight
      - run: git diff --check

  # verifyCiLint (:app:lintCi, :domain:lintCi).
  lint:
    needs: context
    if: needs.context.outputs.run_lint == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          # The OpenLink library is a submodule the app builds from.
          submodules: true
      - run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-user-home" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
      - run: scripts/ci-android-gradle.sh verifyCiLint
      - run: git diff --check

  # Compile a real installable APK and verify that Android can launch it.
  emulator-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    env:
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: scripts/ci-android-gradle.sh :app:assembleCi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-ci-apk-emulator
          path: |
            app/build/outputs/apk/ci/*.apk
            dashboard-emulator-evidence/
