name: publish-apk-release
# Publishes the APK built by personal-apk (main_claude, on demand).
# One release per commit and never a lower version: if this commit or a newer
# version is already published (for example by publish-personal-release), it stops.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [personal-apk]
    types: [completed]
    branches: [main_claude]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-personal-apk-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Find a successfully verified personal APK
        id: build
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_RUN_ID" ]; then
            CANDIDATES="$EVENT_RUN_ID"
          else
            CANDIDATES=$(gh api "repos/$GH_REPO/actions/workflows/personal-apk.yml/runs?branch=main_claude&status=success&per_page=20" --jq '.workflow_runs[].id')
          fi
          for id in $CANDIDATES; do
            RUN=$(gh api "repos/$GH_REPO/actions/runs/$id")
            echo "$RUN" | jq -e '.conclusion == "success" and .head_branch == "main_claude"' > /dev/null || continue
            # A run stopped by its gate (the commit belongs to publish-personal-release) has no APK.
            HAS_APK=$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts" --jq '[.artifacts[] | select(.name == "openvitals-personal-apk" and .expired == false)] | length')
            if [ "$HAS_APK" -gt 0 ]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "id=$id" >> "$GITHUB_OUTPUT"
              echo "sha=$(echo "$RUN" | jq -r .head_sha)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice::No personal-apk build with an APK to publish."
          echo "found=false" >> "$GITHUB_OUTPUT"
      - name: Download the verified installable application
        if: steps.build.outputs.found == 'true'
        env:
          RUN_ID: ${{ steps.build.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$RUN_ID" --name openvitals-personal-apk --dir release
          test -s release/OpenVitals-personal.apk
          test -s release/version-code.txt
          mv release/OpenVitals-personal.apk release/OpenVitals.apk
          cd release
          sha256sum OpenVitals.apk > SHA256SUMS.txt
      - name: Publish APK in GitHub Releases
        if: steps.build.outputs.found == 'true'
        env:
          RUN_ID: ${{ steps.build.outputs.id }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(cat release/version-code.txt)
          RELEASES=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --jq '.[] | {tag: .tag_name, target: .target_commitish, body: (.body // "")}')
          # One release per commit.
          EXISTING=$(echo "$RELEASES" | jq -r --arg sha "$BUILD_SHA" 'select(.target == $sha) | .tag' | head -1)
          if [ -n "$EXISTING" ]; then
            echo "::notice::Commit $BUILD_SHA is already published as $EXISTING; no second release."
            exit 0
          fi
          # Never publish below what phones may already have installed.
          PUBLISHED=$(echo "$RELEASES" | jq -r .body | grep -oE 'Version code: \*\*[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1 || true)
          if [[ -n "$PUBLISHED" ]] && (( PUBLISHED >= VERSION_CODE )); then
            echo "::notice::Version code $PUBLISHED is already published (this build: $VERSION_CODE); keeping latest unchanged."
            exit 0
          fi
          TAG="personal-apk-$RUN_ID"
          cat > release-notes.md <<EOF
          Scarica **OpenVitals.apk** dagli allegati e aprilo sul telefono.

          Build personale su richiesta da main_claude (commit con [apk] o avvio manuale di personal-apk).
          Questa versione aggiorna l'installazione personale compatibile di OpenVitals senza disinstallarla: firma e package coincidono con l'APK pubblicato precedente; installazione e aggiornamento sono verificati su Android 15.

          Health Connect è necessario. Le mappe Mapbox richiedono la configurazione sul telefono.

          Version code: **$VERSION_CODE**.
          Sorgenti: https://github.com/$GH_REPO/commit/$BUILD_SHA
          Compilazione e verifica aggiornamento: https://github.com/$GH_REPO/actions/runs/$RUN_ID
          SHA-256 in **SHA256SUMS.txt**.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already published."
          else
            gh release create "$TAG" release/OpenVitals.apk release/SHA256SUMS.txt \
              --target "$BUILD_SHA" --title "OpenVitals · build su richiesta $VERSION_CODE" \
              --notes-file release-notes.md --latest
          fi
