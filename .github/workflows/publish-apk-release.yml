name: publish-apk-release
on:
  workflow_dispatch:
  workflow_run:
    workflows: [personal-apk]
    types: [completed]
    branches: [main_chatgpt]
  push:
    branches: [main]
    paths: [.github/workflows/publish-apk-release.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-personal-apk-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Normalize existing release APK names and checksums
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false) | @base64' > releases.txt
          while IFS= read -r encoded; do
            entry=$(printf '%s' "$encoded" | base64 -d)
            release_id=$(printf '%s' "$entry" | jq -r .id)
            tag=$(printf '%s' "$entry" | jq -r .tag_name)
            old_id=$(printf '%s' "$entry" | jq -r '[.assets[] | select(.name == "OpenVitals-personal.apk")][0].id // empty')
            new_id=$(printf '%s' "$entry" | jq -r '[.assets[] | select(.name == "OpenVitals.apk")][0].id // empty')
            if [ -z "$old_id$new_id" ]; then continue; fi
            if [ -n "$old_id" ] && [ -n "$new_id" ]; then
              echo "::error::Release $tag contains both APK names; refusing to replace either binary."
              exit 1
            fi
            temp_dir=$(mktemp -d)
            gh release download "$tag" --pattern SHA256SUMS.txt --dir "$temp_dir"
            sed -i 's/OpenVitals-personal\.apk/OpenVitals.apk/g' "$temp_dir/SHA256SUMS.txt"
            if [ -n "$old_id" ]; then
              gh api --method PATCH "repos/$GH_REPO/releases/assets/$old_id" -f name=OpenVitals.apk > /dev/null
            fi
            gh release upload "$tag" "$temp_dir/SHA256SUMS.txt" --clobber
            printf '%s' "$entry" | jq '{body: ((.body // "") | gsub("OpenVitals-personal\\.apk"; "OpenVitals.apk"))}' > "$temp_dir/body.json"
            gh api --method PATCH "repos/$GH_REPO/releases/$release_id" --input "$temp_dir/body.json" > /dev/null
            rm -rf "$temp_dir"
          done < releases.txt
      - name: Find a successfully verified personal APK
        id: build
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_RUN_ID" ]; then
            RUN=$(gh api "repos/$GH_REPO/actions/runs/$EVENT_RUN_ID")
          else
            RUN=$(gh api "repos/$GH_REPO/actions/runs?branch=main_chatgpt&status=success&per_page=100" --jq '[.workflow_runs[] | select(.name == "personal-apk")][0]')
          fi
          echo "$RUN" | jq -e '.conclusion == "success" and .head_branch == "main_chatgpt"' > /dev/null
          echo "id=$(echo "$RUN" | jq -r .id)" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$RUN" | jq -r .head_sha)" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$RUN" | jq -r .run_number)" >> "$GITHUB_OUTPUT"
      - name: Download the verified installable application
        env:
          RUN_ID: ${{ steps.build.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$RUN_ID" --name openvitals-personal-apk --dir release
          test -s release/OpenVitals-personal.apk
          mv release/OpenVitals-personal.apk release/OpenVitals.apk
          cd release
          sha256sum OpenVitals.apk > SHA256SUMS.txt
      - name: Publish APK in GitHub Releases
        env:
          RUN_ID: ${{ steps.build.outputs.id }}
          BUILD_SHA: ${{ steps.build.outputs.sha }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          set -euo pipefail
          # Delayed queued builds must never replace a newer published personal APK.
          LATEST_TAG=$(gh release view --json tagName --jq .tagName)
          if [[ "$LATEST_TAG" =~ ^personal-build-([0-9]+)$ ]]; then
            LATEST_NUMBER="${BASH_REMATCH[1]}"
            if (( 10#$LATEST_NUMBER >= BUILD_NUMBER )); then
              echo "An equal or newer personal build is already published; keeping latest unchanged."
              exit 0
            fi
          fi
          TAG="personal-build-$BUILD_NUMBER"
          cat > release-notes.md <<EOF
          ## Download / Scarica
          Download **OpenVitals.apk** below and open it on your Android phone.
          Scarica **OpenVitals.apk** dagli allegati e aprilo sul telefono Android.
          
          Personal development build from main_chatgpt. This APK passed the personal build's signing and installation/update checks. It updates the compatible OpenVitals Debug personal installation without uninstalling.
          
          Health Connect is required. Grant access to the data you want to display. Mapbox maps require setup on the phone. Upstream Play Store and F-Droid builds are separate distributions.
          
          Source: https://github.com/$GH_REPO/commit/$BUILD_SHA
          Build and installation checks: https://github.com/$GH_REPO/actions/runs/$RUN_ID
          SHA-256 checksums are attached as **SHA256SUMS.txt**.
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already published."
          else
            gh release create "$TAG" release/OpenVitals.apk release/SHA256SUMS.txt \
              --target "$BUILD_SHA" --title "OpenVitals · personal build $BUILD_NUMBER" \
              --notes-file release-notes.md --latest
          fi
