name: publish-personal-release
on:
  push:
    branches: [main, main_claude]
    paths: [.github/workflows/publish-personal-release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-personal-apk-release
  cancel-in-progress: true
jobs:
  # The full verification of this exact revision, run here because no pull request exists for it.
  # 95: it runs beside the build and the device checks instead of before them; the release is
  # published only once all of them have passed, as before, in about half the time.
  verify:
    uses: ./.github/workflows/verify.yml
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    outputs:
      version_code: ${{ steps.version.outputs.code }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Fetch the previous published application
        run: |
          set -euo pipefail
          mkdir -p previous-apk
          gh release download --pattern OpenVitals.apk --dir previous-apk
          test -s previous-apk/OpenVitals.apk
      - name: Set an increasing update version
        id: version
        run: |
          set -euo pipefail
          scripts/ci-android-setup.sh
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging previous-apk/OpenVitals.apk > "$RUNNER_TEMP/previous-badging.txt"
          grep -q "package: name='tech.mmarca.openvitals.debug'" "$RUNNER_TEMP/previous-badging.txt"
          PREVIOUS=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/previous-badging.txt" | head -1)
          test -n "$PREVIOUS"
          # The release GitHub calls "latest" is not always the newest build (another branch's
          # older build was, and 2.17.5 came out below 2.17.4: Android refused it as a downgrade).
          # Every release's notes state its version code; the next build goes above all of them.
          PUBLISHED=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --jq '.[].body' \
            | grep -oE 'Version code: \*\*[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1 || true)
          if [[ -n "$PUBLISHED" ]] && (( PUBLISHED > PREVIOUS )); then PREVIOUS=$PUBLISHED; fi
          NEXT=$((PREVIOUS + 1))
          if (( NEXT < 1070400000 )); then NEXT=1070400000; fi
          echo "OPENVITALS_VERSION_CODE=$NEXT" >> "$GITHUB_ENV"
          echo "code=$NEXT" >> "$GITHUB_OUTPUT"
          echo "OPENVITALS_VERSION_NAME=2.17.13-personal-claude" >> "$GITHUB_ENV"
      - name: Build the signed personal update
        env:
          OPENVITALS_RELEASE_STORE_FILE: ${{ github.workspace }}/personal/personal.p12
          OPENVITALS_RELEASE_STORE_PASSWORD: openvitals-personal
          OPENVITALS_RELEASE_KEY_ALIAS: personal
          OPENVITALS_SIGN_DEBUG_WITH_RELEASE_KEY: 'true'
          OPENVITALS_PUBLISHED_DEBUG_APK: 'true'
        run: scripts/ci-android-gradle.sh verifyTranslations :app:assembleDebug :app:assembleCi :app:assembleCiAndroidTest
      - name: Lay out the ci APKs for the device checks
        run: |
          mkdir -p verified-ci
          cp -r app/build/outputs/apk/. verified-ci/
          test -s verified-ci/ci/app-ci.apk
      - name: Check package, version and signing certificate
        run: |
          set -euo pipefail
          mkdir -p personal-apk
          cp app/build/outputs/apk/debug/app-debug.apk personal-apk/OpenVitals-personal.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging personal-apk/OpenVitals-personal.apk > "$RUNNER_TEMP/update-badging.txt"
          grep -q "package: name='tech.mmarca.openvitals.debug'" "$RUNNER_TEMP/update-badging.txt"
          grep -q "versionCode='$OPENVITALS_VERSION_CODE'" "$RUNNER_TEMP/update-badging.txt"
          "$SIGNER" verify --verbose --print-certs personal-apk/OpenVitals-personal.apk > personal-apk/signing-certificate.txt
          "$SIGNER" verify --print-certs previous-apk/OpenVitals.apk > personal-apk/previous-certificate.txt
          for cert in previous-certificate signing-certificate; do
            sed -nE 's/^.*Signer.*certificate SHA-256 digest: ([[:xdigit:]]+).*$/\1/p' "personal-apk/$cert.txt" | tr '[:upper:]' '[:lower:]' | sort -u > "personal-apk/$cert.sha256"
            test -s "personal-apk/$cert.sha256"
          done
          cmp personal-apk/previous-certificate.sha256 personal-apk/signing-certificate.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation, update and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/verify-personal-install.sh && bash scripts/verify-screenshot-import.sh
      - uses: actions/upload-artifact@v4
        with:
          name: personal-apk
          path: personal-apk/OpenVitals-personal.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-release-install-checks
          path: |
            personal-apk/
            screenshot-import-evidence/
          if-no-files-found: ignore
  release:
    needs: [verify, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OPENVITALS_VERSION_CODE: ${{ needs.build.outputs.version_code }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: personal-apk
          path: personal-apk
      - name: Publish the verified APK as a GitHub release
        run: |
          set -euo pipefail
          test -n "$OPENVITALS_VERSION_CODE"
          mkdir -p release
          cp personal-apk/OpenVitals-personal.apk release/OpenVitals.apk
          (cd release && sha256sum OpenVitals.apk > SHA256SUMS.txt)
          TAG="personal-claude-$GITHUB_RUN_ID"
          cat > release-notes.md <<EOF
          Scarica **OpenVitals.apk** dagli allegati e aprilo sul telefono.

          Branch main_claude — 86, 88, 94, 99, 100, 104, 110–112:
          - 86: la copia web (PWA) torna indietro sempre: il pulsante "Indietro", il tasto Esc e la freccia in alto nelle schermate tornano alla schermata precedente (anche aprendo un link diretto a una schermata), i pulsanti piccoli dentro le schede si toccano senza che la scheda li copra, e senza connessione appare un messaggio invece di una pagina nera. La cattura delle schermate non si ferma più con "the app did not open".
          - 88: il grafico "Passo" usa la fonte che copre davvero l'attività (velocità registrata, percorso GPS o parziali): se l'orologio scrive la velocità solo negli ultimi secondi, il grafico usa il percorso. Il passo medio è tempo diviso distanza, e l'asse mostra solo minuti e secondi, senza "min/" tagliato.
          - 94: toccando il toggle OpenVitals si apre il riepilogo del periodo selezionato (giorno, settimana, mese, anno), con il suo titolo: sonno, passi, allenamento (sì o no) e calorie attive. Le onde crescono con questi valori. Non c'è più lo stato di Health Connect.
          - 99: la matita apre la modifica come si apre una schermata (compare sopra, sfumando e crescendo) e la chiude come si torna indietro (sfuma e si rimpicciolisce sopra la schermata principale): la stessa transizione in entrata e in uscita.
          - 100: alla prima apertura dell'app il toggle mostra "Bentornato, nome" con una dissolvenza, poi parte l'animazione. Prima il saluto non compariva se la schermata non era ancora caricata.
          - 104: l'altitudine da Mapbox non si arrende più sulle uscite lunghe (passa a uno zoom più largo), riprova un tile che non risponde, legge l'altezza tra i pixel invece che a gradini e la smussa leggermente. Se Mapbox è collegato ma il terreno non si carica, la nota sotto il grafico lo dice.
          - 110: Corsa, tapis roulant, bicicletta e bici da camera hanno il grafico del tempo in ciascuna zona cardiaca (1–5), se ci sono battiti e un battito massimo (dal profilo o dall'età).
          - 111: in Attività, dopo "Carica altri 10", aprendo un'attività e tornando indietro restano visibili tutte quelle caricate.
          - 112: il tapis roulant non mostra più il grafico "Velocità".

          Questa versione aggiorna l'installazione personale compatibile di OpenVitals senza disinstallarla. La revisione ha superato la verifica completa (verify) in questa stessa esecuzione; package e firma coincidono con l'APK pubblicato precedente; installazione, aggiornamento, avvio e import screenshot sono verificati su Android 15.

          Versione: **2.17.13-personal-claude**. Version code: **$OPENVITALS_VERSION_CODE**.
          Sorgenti: https://github.com/$GH_REPO/commit/$GITHUB_SHA
          Compilazione e verifica aggiornamento: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release already exists; keeping the published APK unchanged."
          else
            gh release create "$TAG" release/OpenVitals.apk release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "OpenVitals 2.17.13 · main_claude" --notes-file release-notes.md --latest
          fi
