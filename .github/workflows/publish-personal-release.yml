name: publish-personal-release
on:
  push:
    branches: [main, main_claude]
    paths: [.github/workflows/publish-personal-release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-personal-apk-release
  cancel-in-progress: true
jobs:
  # The full verification of this exact revision, run here because no pull request exists for it.
  # 95: it runs beside the build and the device checks instead of before them; the release is
  # published only once all of them have passed, as before, in about half the time.
  verify:
    uses: ./.github/workflows/verify.yml
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    outputs:
      version_code: ${{ steps.version.outputs.code }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - name: Fetch the previous published application
        run: |
          set -euo pipefail
          mkdir -p previous-apk
          gh release download --pattern OpenVitals.apk --dir previous-apk
          test -s previous-apk/OpenVitals.apk
      - name: Set an increasing update version
        id: version
        run: |
          set -euo pipefail
          scripts/ci-android-setup.sh
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging previous-apk/OpenVitals.apk > "$RUNNER_TEMP/previous-badging.txt"
          grep -q "package: name='tech.mmarca.openvitals.debug'" "$RUNNER_TEMP/previous-badging.txt"
          PREVIOUS=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/previous-badging.txt" | head -1)
          test -n "$PREVIOUS"
          # The release GitHub calls "latest" is not always the newest build (another branch's
          # older build was, and 2.17.5 came out below 2.17.4: Android refused it as a downgrade).
          # Every release's notes state its version code; the next build goes above all of them.
          PUBLISHED=$(gh api "repos/$GH_REPO/releases?per_page=100" --paginate --jq '.[].body' \
            | grep -oE 'Version code: \*\*[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1 || true)
          if [[ -n "$PUBLISHED" ]] && (( PUBLISHED > PREVIOUS )); then PREVIOUS=$PUBLISHED; fi
          NEXT=$((PREVIOUS + 1))
          if (( NEXT < 1070400000 )); then NEXT=1070400000; fi
          echo "OPENVITALS_VERSION_CODE=$NEXT" >> "$GITHUB_ENV"
          echo "code=$NEXT" >> "$GITHUB_OUTPUT"
          echo "OPENVITALS_VERSION_NAME=2.17.23-personal-claude" >> "$GITHUB_ENV"
      - name: Build the signed personal update
        env:
          OPENVITALS_RELEASE_STORE_FILE: ${{ github.workspace }}/personal/personal.p12
          OPENVITALS_RELEASE_STORE_PASSWORD: openvitals-personal
          OPENVITALS_RELEASE_KEY_ALIAS: personal
          OPENVITALS_SIGN_DEBUG_WITH_RELEASE_KEY: 'true'
          OPENVITALS_PUBLISHED_DEBUG_APK: 'true'
        run: scripts/ci-android-gradle.sh verifyTranslations :app:assembleDebug :app:assembleCi :app:assembleCiAndroidTest
      - name: Lay out the ci APKs for the device checks
        run: |
          mkdir -p verified-ci
          cp -r app/build/outputs/apk/. verified-ci/
          test -s verified-ci/ci/app-ci.apk
      - name: Check package, version and signing certificate
        run: |
          set -euo pipefail
          mkdir -p personal-apk
          cp app/build/outputs/apk/debug/app-debug.apk personal-apk/OpenVitals-personal.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging personal-apk/OpenVitals-personal.apk > "$RUNNER_TEMP/update-badging.txt"
          grep -q "package: name='tech.mmarca.openvitals.debug'" "$RUNNER_TEMP/update-badging.txt"
          grep -q "versionCode='$OPENVITALS_VERSION_CODE'" "$RUNNER_TEMP/update-badging.txt"
          "$SIGNER" verify --verbose --print-certs personal-apk/OpenVitals-personal.apk > personal-apk/signing-certificate.txt
          "$SIGNER" verify --print-certs previous-apk/OpenVitals.apk > personal-apk/previous-certificate.txt
          for cert in previous-certificate signing-certificate; do
            sed -nE 's/^.*Signer.*certificate SHA-256 digest: ([[:xdigit:]]+).*$/\1/p' "personal-apk/$cert.txt" | tr '[:upper:]' '[:lower:]' | sort -u > "personal-apk/$cert.sha256"
            test -s "personal-apk/$cert.sha256"
          done
          cmp personal-apk/previous-certificate.sha256 personal-apk/signing-certificate.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installation, update and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/verify-personal-install.sh && bash scripts/verify-screenshot-import.sh
      - uses: actions/upload-artifact@v4
        with:
          name: personal-apk
          path: personal-apk/OpenVitals-personal.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-release-install-checks
          path: |
            personal-apk/
            screenshot-import-evidence/
          if-no-files-found: ignore
  release:
    needs: [verify, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OPENVITALS_VERSION_CODE: ${{ needs.build.outputs.version_code }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: personal-apk
          path: personal-apk
      - name: Publish the verified APK as a GitHub release
        run: |
          set -euo pipefail
          test -n "$OPENVITALS_VERSION_CODE"
          mkdir -p release
          cp personal-apk/OpenVitals-personal.apk release/OpenVitals.apk
          (cd release && sha256sum OpenVitals.apk > SHA256SUMS.txt)
          TAG="personal-claude-$GITHUB_RUN_ID"
          cat > release-notes.md <<EOF
          Scarica **OpenVitals.apk** dagli allegati e aprilo sul telefono.

          Branch main_claude — 94, 99, 100, 104, 127, 131-133, 136, 141-152:
          - Toggle OpenVitals e scheda del sonno: la media del sonno del periodo è calcolata nello stesso modo (solo la notte, senza risvegli e pisolini), quindi i due numeri coincidono.
          - Modalità modifica: uscendo senza essere tornati in cima non compare più per un istante la parte alta della modifica.
          - "Welcome back": entra e si spegne come un televisore a tubo catodico (una linea luminosa che si apre; in uscita si chiude dall'alto e dal basso fino a un punto). Parte quando la pagina principale è caricata.
          - Altitudine: oltre a Mapbox si legge il modello del terreno aperto Terrarium (AWS Open Data, gratis, senza account), sempre per riquadri e mai il percorso. Dove i due concordano si usa la media, dove uno salta (ponti, edifici, buchi) vale l'altro; senza Mapbox basta Terrarium.
          - Elenco attività: le corse su tapis roulant mostrano solo la durata, senza FC media.
          - Dettaglio attività: anche Metriche, Dettagli sessione, Segmenti, Percorso, Analisi del percorso, Navigazione ed Esporta si spostano e si nascondono come i grafici. Nuovo ordine logico: cifre, mappa, grafico del tipo, cuore, velocità e parziali, terreno, ritmo, sforzo, record, dettagli ed esportazione.
          - Due sezioni "Giri": quella con le barre ora si chiama "Suddivisioni · giri del dispositivo", la tabella resta "Giri".
          - Attività per anno più veloci: le metriche delle sessioni si leggono in parallelo.
          - Corsa e camminata con GPS: velocità, cadenza, falcata e passo usano l'app che ha registrato l'attività, escludono le pause e sono verificati su distanza e passi (unità sbagliata o cadenza "per piede" corrette, altrimenti la velocità dal GPS).
          - Peso: "Latest" e "Change" ai due lati della scheda; una variazione negativa ha il segno meno.
          - Calorie attive: contano anche i passi, fascia per fascia (si prende il maggiore fra energia registrata e passi), così una giornata di camminata non vale zero e un allenamento non si somma due volte.
          - Cambiando periodo in qualunque schermata e nel toggle si vedono solo i dati del nuovo periodo: finché arrivano, al posto dei vecchi c'è il caricamento.
          - Sonno: tenendo premuto sul grafico si leggono giorno e ore; "Load 10 more" mostra solo notti del periodo scelto e non le perde scorrendo o tornando indietro.
          - Pagina principale: cambiando periodo resta la pagina dei riquadri in cui sei.
          - Toggle: ogni onda a 100 % è alta quanto le altre (le calorie attive al 90 % non restano più basse).
          - Colori della pagina principale: si prendono dagli anelli e dai riquadri davvero mostrati; "I colori della schermata principale" usa la prima pagina, o il primo blocco 4x4 senza pagine.

          Branch main_claude — 127, 129, 130, 135-140:
          - Tapis roulant: nel riepilogo in alto c'è solo la durata, non più la FC media.
          - Toggle OpenVitals, riepilogo: le barre non hanno più il puntino finale né lo spazio fra parte piena e vuota.
          - Grafici delle attività: i valori delle tre colonne in alto stanno sempre su una riga, il testo si rimpicciolisce invece di andare a capo.
          - Velocità e cadenza passi: si usano solo i campioni dentro l'attività e di una sola app (orologio e app che lo copia non si mescolano più), ripuliti dai valori isolati; la media è pesata sul tempo. Una corsa con cadenza scritta "per piede" (sotto 110 passi/min) viene contata in passi. La falcata usa gli stessi dati.
          - Le curve partono dall'asse: se il primo valore arriva dopo l'inizio, quello iniziale è stimato (mediana dei primi valori).
          - I numeri sugli assi non sono più colorati.
          - "Gradient distribution" ha lo stile delle altre schede: tre colonne in alto e barre come le zone cardiache, nel colore dell'altitudine.
          - Passo, serie, recupero e grafici a due linee: tenendo premuto e scorrendo si legge il valore sotto il dito, come negli altri grafici.

          Questa versione aggiorna l'installazione personale compatibile di OpenVitals senza disinstallarla. La revisione ha superato la verifica completa (verify) in questa stessa esecuzione; package e firma coincidono con l'APK pubblicato precedente; installazione, aggiornamento, avvio e import screenshot sono verificati su Android 15.

          Versione: **2.17.23-personal-claude**. Version code: **$OPENVITALS_VERSION_CODE**.
          Sorgenti: https://github.com/$GH_REPO/commit/$GITHUB_SHA
          Compilazione e verifica aggiornamento: https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release already exists; keeping the published APK unchanged."
          else
            gh release create "$TAG" release/OpenVitals.apk release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "OpenVitals 2.17.23 · main_claude" --notes-file release-notes.md --latest
          fi
