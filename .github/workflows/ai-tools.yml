name: AI tools
on:
  push:
    branches: [main_claude, main]
    paths: ['scripts/ai/**', 'tools/ai-node/**', 'tools/vibetest/**', 'tools/darts/**', 'tools/catalogs/**', '.container-use/**', '.mcp.json', '.gemini/**', '.github/workflows/ai-tools.yml']
  pull_request:
    paths: ['scripts/ai/**', 'tools/ai-node/**', 'tools/vibetest/**', 'tools/darts/**', 'tools/catalogs/**', '.container-use/**', '.mcp.json', '.gemini/**', '.github/workflows/ai-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/ai-node/package-lock.json
      - run: npm ci --prefix tools/ai-node --no-audit --no-fund
      - run: bash scripts/ai/gemini.sh --version
      - run: bash scripts/ai/playwriter.sh --help
      - run: npm --prefix web run build
      - run: npm --prefix web test
      - run: python3 scripts/ai/playwriter-smoke.py
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
  container-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - run: bash scripts/ai/container-use.sh install
      - run: bash scripts/ai/container-use.sh doctor
  vibetest-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 tools/vibetest/.venv
      - run: uv pip sync --python tools/vibetest/.venv/bin/python tools/vibetest/requirements.lock
      - run: tools/vibetest/.venv/bin/python scripts/ai/vibetest-smoke.py
  catalogues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ai/catalogs.py sync all
      - run: python3 scripts/ai/catalogs.py verify all
      - run: python3 scripts/ai/catalogs.py search all android testing --limit 5
  darts-forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: bash scripts/ai/darts.sh install
      - run: tools/darts/.venv/bin/python tools/darts/smoke.py
