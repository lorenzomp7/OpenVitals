name: AI tools
on:
  push:
    branches: [main_chatgpt, main]
    paths: ['scripts/ai/**', 'tools/ai-node/**', '.container-use/**', '.mcp.json', '.gemini/**', '.github/workflows/ai-tools.yml']
  pull_request:
    paths: ['scripts/ai/**', 'tools/ai-node/**', '.container-use/**', '.mcp.json', '.gemini/**', '.github/workflows/ai-tools.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/ai-node/package-lock.json
      - run: npm ci --prefix tools/ai-node --no-audit --no-fund
      - run: bash scripts/ai/gemini.sh --version
      - run: bash scripts/ai/playwriter.sh --help
      - run: npm --prefix web test
      - run: python3 scripts/ai/playwriter-smoke.py
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
  container-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - run: bash scripts/ai/container-use.sh install
      - run: bash scripts/ai/container-use.sh doctor
