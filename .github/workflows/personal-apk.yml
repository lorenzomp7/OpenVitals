name: personal-apk
on:
  push:
    branches: [main_chatgpt]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      OPENVITALS_RELEASE_KEYSTORE_BASE64: ${{ secrets.OPENVITALS_PERSONAL_KEYSTORE_BASE64 }}
      OPENVITALS_RELEASE_STORE_PASSWORD: ${{ secrets.OPENVITALS_PERSONAL_STORE_PASSWORD }}
      OPENVITALS_RELEASE_KEY_ALIAS: ${{ secrets.OPENVITALS_PERSONAL_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare private signing key
        run: |
          test -n "$OPENVITALS_RELEASE_KEYSTORE_BASE64" || { echo '::error::Configure personal signing secrets using scripts/setup-personal-signing.ps1'; exit 1; }
          test -n "$OPENVITALS_RELEASE_STORE_PASSWORD"
          test -n "$OPENVITALS_RELEASE_KEY_ALIAS"
          umask 077
          printf '%s' "$OPENVITALS_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openvitals-personal.p12"
          echo "OPENVITALS_RELEASE_STORE_FILE=$RUNNER_TEMP/openvitals-personal.p12" >> "$GITHUB_ENV"
      - name: Set increasing personal version code
        run: echo "OPENVITALS_VERSION_CODE=$((1070400000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build signed personal APK
        env:
          OPENVITALS_PERSONAL_BUILD: 'true'
          OPENVITALS_SIGN_DEBUG_WITH_RELEASE_KEY: 'true'
          OPENVITALS_PUBLISHED_DEBUG_APK: 'true'
        run: scripts/ci-android-gradle.sh :app:assembleDebug
      - name: Verify signed package and prepare installable APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/personal-badging.txt"
          grep -q "package: name='tech.mmarca.openvitals.personal'" "$RUNNER_TEMP/personal-badging.txt"
          mkdir -p personal-apk
          "$SIGNER" verify --verbose --print-certs "$APK" > personal-apk/signing-certificate.txt
          cp "$APK" personal-apk/OpenVitals-personal.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check installation and update without uninstall
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/verify-personal-install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: openvitals-personal-apk
          path: personal-apk/
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/openvitals-personal.p12"
