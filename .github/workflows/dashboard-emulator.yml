name: Dashboard APK emulator smoke test

on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - '.github/workflows/dashboard-emulator.yml'

permissions:
  contents: read

jobs:
  dashboard-emulator:
    runs-on: macos-15-intel
    timeout-minutes: 55
    env:
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable APK
        run: ./gradlew :app:assembleCi
      - name: Boot Android, install APK and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/emulator-smoke.sh
      - name: Upload APK and emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-emulator-apk-and-screenshot
          path: |
            app/build/outputs/apk/ci/*.apk
            dashboard-emulator-evidence/
          if-no-files-found: warn
