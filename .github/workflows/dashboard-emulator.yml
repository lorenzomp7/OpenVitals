name: Dashboard APK emulator smoke test

on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - '.github/workflows/dashboard-emulator.yml'

permissions:
  contents: read

jobs:
  dashboard-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable APK
        run: scripts/ci-android-gradle.sh :app:assembleCi
      - name: Boot Android, install APK and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            APK=$(find app/build/outputs/apk/ci -name '*.apk' -type f | head -1)
            test -s "$APK"
            adb install -r "$APK"
            adb shell am start -n tech.mmarca.openvitals.ci/tech.mmarca.openvitals.MainActivity || adb shell monkey -p tech.mmarca.openvitals.ci 1
            sleep 12
            adb shell pidof tech.mmarca.openvitals.ci
            mkdir -p dashboard-emulator-evidence
            adb shell screencap -p /sdcard/dashboard.png
            adb pull /sdcard/dashboard.png dashboard-emulator-evidence/dashboard.png
            adb logcat -d -t 2000 > dashboard-emulator-evidence/logcat.txt
      - name: Upload APK and emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-emulator-apk-and-screenshot
          path: |
            app/build/outputs/apk/ci/*.apk
            dashboard-emulator-evidence/
          if-no-files-found: warn
