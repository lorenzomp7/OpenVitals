name: Personal Mapbox verification
on:
  pull_request:
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - '.github/workflows/mapbox-verification.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify APK and tests with dependency locking enabled
        run: scripts/ci-android-gradle.sh :app:assembleCi :app:assembleCiAndroidTest verifyCiUnitTest verifyCiPreflight
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and run dashboard and route tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/personal-ui-verification.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mapbox-build
          path: |
            app/build/outputs/apk/ci/*.apk
            app/build/outputs/apk/androidTest/ci/*.apk
            app/gradle.lockfile
            app/build/reports/tests/
            dashboard-emulator-evidence/
